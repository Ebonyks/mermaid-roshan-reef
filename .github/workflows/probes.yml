name: Probe suite (graphics fork)

# The remote dev container has no Godot binary (GitHub downloads are
# proxy-blocked in-session), so the CLAUDE.md probe gate runs here instead:
# headless import + every trusted probe.  Each probe gets a fresh user-data
# directory so a previous probe cannot hide an auto-win or fabricate a load.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: probes-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the repo; the APK publish lives in android.yml with its
# own token. Least privilege keeps a compromised probe/dep from writing back.
permissions:
  contents: read

env:
  GODOT_RELEASE: "4.7.1-stable"
  # Official value from the 4.7.1-stable release's SHA512-SUMS.txt, verified
  # 2026-07-26. A Godot version bump must update this in the same commit.
  GODOT_ZIP_SHA512: "4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9"

jobs:
  probes:
    runs-on: ubuntu-latest
    # Green runs now take ~24 min (probes ~14 min + visual captures); at 30
    # the slow-runner tail dies mid-capture and GitHub reports the timeout as
    # "cancelled", which reads like a phantom cancel. Keep ~20 min headroom.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The 2D migration gate verifies its immutable ceiling against full
          # reachable history; a depth-1 clone could hide reintroduced debt.
          fetch-depth: 0
          persist-credentials: false

      - name: Download Godot (checksum-verified)
        run: |
          godot_archive="${RUNNER_TEMP}/godot.zip"
          godot_extract="${RUNNER_TEMP}/godot"
          curl -sSL -o "${godot_archive}" "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          echo "${GODOT_ZIP_SHA512}  ${godot_archive}" | sha512sum -c -
          mkdir -p "${godot_extract}"
          unzip -q "${godot_archive}" -d "${godot_extract}"
          sudo mv "${godot_extract}/Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot

      - name: Static gates (parse + Variant-inference lint)
        # a parse error in main.gd makes every probe idle to its 8m timeout
        # and the job dies at the 30m ceiling as an opaque 'cancelled' -
        # catch it here in seconds instead (incidents: tnode, sm2 2026-07-11)
        run: |
          pip install --quiet gdtoolkit==4.5.0 numpy==2.5.1 Pillow==12.3.0 scipy==1.18.0
          python3 -m gdtoolkit.parser $(find scripts -name '*.gd')
          python3 tools/lint_inference.py scripts/*.gd scripts/arena/*.gd scripts/games/*.gd
          # Owner decision 2026-08-09: Mermaid Roshan is 2D-only. The stress
          # pass proves every rule can fail before the real project is gated.
          python3 tools/audit_roshan_2d.py --stress
          python3 tools/audit_roshan_2d.py
          # The Roshan audit remains the narrow atlas/identity invariant. The
          # authoritative game-wide migration contract must also prove that
          # its debt ceiling and falsification checks cannot be laundered.
          python3 -m unittest tools.tests.test_audit_game_2d
          python3 tools/audit_game_2d.py --stress
          python3 -m unittest tools.tests.test_audit_roshan_sprite_clipping
          python3 tools/audit_roshan_sprite_clipping.py
          python3 tools/audit_probe_parity.py --stress
          python3 tools/audit_probe_parity.py
          python3 tools/audit_fairy_art_v2.py
          python3 tools/prepare_opera_nursery_art.py --check-only
          python3 tools/prepare_opera_minigame_art.py --check-only
          python3 tools/audit_opera_roshan_animation.py
          python3 tools/build_area_music.py --check
          python3 tools/audit_sky_lagoon_kit.py
          python3 tools/audit_scene_congruency.py
          # Painted 2.5D flats are drawn unshaded, so the Environment grade is
          # the only thing between an approved PNG and the child's screen. This
          # replays the shipped grade over the real art and fails when a profile
          # clips or crushes pixels the source did not
          # (LIGHTING_2P5D_AUDIT_2026-08-02 §1.7/§E1). Needs no Godot binary,
          # so it belongs here with the other seconds-long static gates.
          python3 -m unittest tools.tests.test_check_grade_headroom
          python3 tools/check_grade_headroom.py
          # Castle V4 delivery is source-owned and frame-reviewed. Keep these
          # release gates in the protected probe workflow as well as ci.sh so
          # promotion cannot accept stale healing, cutouts, or approvals.
          python3 tools/build_castle_interaction_v4_delivery.py --check
          python3 tools/audit_castle_native_interactions.py
          python3 tools/repair_castle_room_native_backgrounds.py --check
          python3 tools/refine_castle_depth_cards.py --check
          python3 tools/audit_castle_static_depth_cards.py
          python3 -m unittest \
            tools.test_audit_castle_native_interactions \
            tools.test_build_castle_interaction_v4_delivery \
            tools.test_castle_interaction_frame_qa \
            tools.test_review_castle_interaction_frames_v4 \
            tools.test_refine_castle_depth_cards \
            tools.test_audit_castle_static_depth_cards \
            tools.test_repair_castle_room_native_backgrounds
          python3 tools/review_castle_interaction_frames_v4.py check

      - name: Import (deadlock-guarded)
        run: |
          set -o pipefail
          # 12m -> 20m (alpha polish 2026-08-05): 586 tracked .import sidecars
          # now request VRAM compression, adding a cold ETC2/ASTC encode pass
          # (~32s on a 16-core dev box; headroom for the 2-core runner).
          timeout 20m godot --headless --path . --import 2>&1 | tee /tmp/import.out || (echo "IMPORT FAIL (hang or error)" && exit 1)
          if grep -qE 'SCRIPT ERROR|Invalid assignment of property or key|The tweened property .* does not exist|ERROR:.*(Failed loading resource|Cannot open file|No loader found|Resource file not found)|Parse Error|Compile Error|ERR_FILE_CORRUPT|Error importing|Cannot load resource' /tmp/import.out; then
            echo "IMPORT FAIL (resource or script error)"
            exit 1
          fi
          # Run the exact inventory only after the required 4.7.1 import has
          # recreated the generated sidecars captured by the shrinking debt
          # baseline. Green means NO_REGRESSION, never that migration is done.
          python3 tools/audit_game_2d.py --regression-gate

      - name: Compile-check every script (real analyzer, catches what parse-only cannot)
        # probes only compile scripts the run actually loads; lazily-loaded
        # scripts (galaxy, kart, dev_mode) could still ship inference errors.
        # --check-only runs Godot's full analyzer per file in project context.
        run: |
          FAILED=0
          while IFS= read -r f; do
            if ! OUT=$(timeout 60 godot --headless --check-only --script "$f" 2>&1); then
              echo "COMPILE FAIL: $f"; echo "$OUT" | head -20; FAILED=1
            fi
          done < <(find scripts -name '*.gd')
          exit $FAILED

      - name: Run trusted probes
        run: |
          set -o pipefail
          FAILED=0
          RUNTIME_ERROR_RE='SCRIPT ERROR|Invalid assignment of property or key|The tweened property .* does not exist|ERROR:.*(Failed loading resource|Cannot open file|No loader found|Resource file not found)'
          FAILURE_RE='FAIL|FAILED|ISSUE|TIMEOUT|STUCK|DID NOT|MISSING|SCRIPT ERROR|Parse Error|Compile Error'
          # NOTE: probe_human_art_audit is a display-only screenshot capture with
          # no assertions; under --headless it prints "HEADLESS SKIP" and exits 0,
          # so gating it here only manufactured false confidence. It runs under the
          # xvfb visual-review step below instead.
          for p in probe_reef_districts probe_ocean_kingdoms probe_audit probe_passive probe_living_world probe_load probe_rank probe_save_recovery probe_galaxy_state probe_collection probe_mg2d probe_fetch probe_melody probe_dolls probe_seek probe_audio probe_dance probe_l2 probe_l2_living_cards probe_sky_lagoon_animals probe_l2_reenter probe_crown probe_throne probe_northern probe_train probe_verbs probe_carry probe_grotto probe_flow probe_skins probe_touch_router probe_touch_stress probe_interaction probe_touch_adversary probe_touch_look probe_ui_system probe_voice probe_kart_feel probe_combat probe_dust_bunny probe_dust_bunny_boss probe_dust_boss probe_hit probe_partner probe_combat_tutorial probe_imp_ai probe_mic probe_stuffie probe_dungeon probe_ember probe_opera probe_opera_2d probe_opera_detective probe_opera_pipe probe_opera_nursery probe_opera_gesture_quality probe_kitchen_props probe_bathroom_props probe_bathroom_integration probe_castle_pearl_art probe_fairy_art probe_props; do
            if [ ! -f "scripts/$p.gd" ]; then
              echo "PROBE $p MISSING: scripts/$p.gd is required"
              FAILED=1
              continue
            fi
            echo "=== $p ==="
            PROBE_HOME="/tmp/reef-$p"
            rm -rf "$PROBE_HOME"
            mkdir -p "$PROBE_HOME/data" "$PROBE_HOME/config"
            TOUCH_TEST_MODE="--classic-touch-test"
            case "$p" in
              probe_passive|probe_touch_router|probe_touch_stress|probe_interaction|probe_touch_adversary)
                TOUCH_TEST_MODE="--hybrid-touch-test"
                ;;
            esac
            PROBE_RC=0
            XDG_DATA_HOME="$PROBE_HOME/data" XDG_CONFIG_HOME="$PROBE_HOME/config" \
              timeout 8m godot --headless -s "scripts/$p.gd" -- --touch "$TOUCH_TEST_MODE" 2>&1 | tee "/tmp/$p.out" || PROBE_RC=$?
            if [ "$PROBE_RC" -ne 0 ]; then
              # Known engine flaw (2026-07-18): Godot 4.4 sometimes deadlocks at
              # EXIT after a probe has already printed its complete verdict —
              # observed repeatedly in processes that ran a KartGame, always
              # AFTER an ALL OK line. Accept a timeout kill (124) only when the
              # transcript ends with a final verdict marker; the FAILURE_RE and
              # runtime-error greps below still veto any bad content. Every
              # other nonzero exit stays a real failure.
              if [ "$PROBE_RC" -eq 124 ] && tail -n 5 "/tmp/$p.out" | grep -qE "ALL OK|RESULT"; then
                echo "PROBE $p reached its verdict; engine hung at exit and was reaped - accepted"
              else
                FAILED=1
              fi
            fi
            if grep -qE "$FAILURE_RE" "/tmp/$p.out"; then
              echo "PROBE $p reported a failure or runtime script error"
              FAILED=1
            fi
            if grep -qE "Parse Error|Compile Error" "/tmp/$p.out"; then
              echo "PROBE $p hit a script compile error - aborting gate"
              exit 1
            fi
            if grep -qE "$RUNTIME_ERROR_RE" "/tmp/$p.out"; then
              echo "PROBE $p reported a resource or property runtime error"
              FAILED=1
            fi
            # positive floor: a probe that exits 0 while printing nothing
            # asserted nothing - silent no-op must not count as a pass
            if [ ! -s "/tmp/$p.out" ]; then
              echo "PROBE $p produced no output - silent no-op treated as failure"
              FAILED=1
            fi
          done
          exit $FAILED

      # Display-build boot gate. The area the game opens in is chosen behind
      # `DisplayServer.get_name() != "headless"`, so NOTHING in the headless
      # block above can execute it: the phone shipped a boot that dropped
      # Roshan into the legacy 3D reef while every headless probe stayed green
      # (owner report 2026-07-29). This runs the real boot under a real
      # viewport and GATES it — a broken first area must never reach the APK
      # again. Xvfb flakiness is absorbed with one retry rather than by making
      # the gate advisory; a run that yields no verdict twice is a failure.
      - name: Boot gate (real viewport — the area the phone opens in)
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          set -o pipefail
          OUT=/tmp/probe_boot_display.out
          for attempt in 1 2; do
            BOOT_HOME="/tmp/reef-boot-$attempt"
            rm -rf "$BOOT_HOME"
            mkdir -p "$BOOT_HOME/data" "$BOOT_HOME/config"
            XDG_DATA_HOME="$BOOT_HOME/data" XDG_CONFIG_HOME="$BOOT_HOME/config" \
              timeout 6m xvfb-run -a godot --rendering-method mobile \
              -s scripts/probe_boot_display.gd -- --touch 2>&1 | tee "$OUT" || true
            grep -q "^RESULT|" "$OUT" && break
            echo "Boot gate produced no verdict on attempt $attempt (Xvfb flake?); retrying"
          done
          if ! grep -q "^RESULT|PASS" "$OUT"; then
            echo "BOOT GATE FAILED — the game does not open on the promenade"
            exit 1
          fi
          if grep -qE 'BOOTDISPLAY\|.*\|FAIL|SCRIPT ERROR|Parse Error|Compile Error' "$OUT"; then
            echo "BOOT GATE FAILED — assertion or script error during boot"
            exit 1
          fi

      # Advisory boss stress test: 25 simulated-child encounters against the
      # Dust Bunny Boss plus 5 control extremes (asleep / never-looks-at-the-
      # tell / perfect / very slow / never-moves), fixed-timestep and driven
      # through real touch_ui taps. Prints DUSTBAL| metrics and a verdict
      # against the 45-120s fun band. Review-only — never gates the build.
      # (DUST_BUNNY_BOSS_STRESS_TEST_2026-08-02.md)
      - name: Dust boss balance playtest (advisory)
        continue-on-error: true
        run: |
          DB_HOME="/tmp/reef-dustbal"
          rm -rf "$DB_HOME"
          mkdir -p "$DB_HOME/data" "$DB_HOME/config"
          XDG_DATA_HOME="$DB_HOME/data" XDG_CONFIG_HOME="$DB_HOME/config" \
            timeout 10m godot --headless -s scripts/probe_dust_boss_balance.gd -- --touch 2>&1 | grep -E "^DUSTBAL\|" || true
          XDG_DATA_HOME="$DB_HOME/data" XDG_CONFIG_HOME="$DB_HOME/config" \
            timeout 6m godot --headless -s scripts/probe_dust_boss_balance.gd -- --touch --controls 2>&1 | grep -E "^DUSTBAL\|" || true

      # Advisory balance playtest: ten simulated-child runs per opera act
      # (personas with reaction delays, travel, wandering, wrong taps) via
      # manual _process pumping. Prints BALANCE| metrics with a verdict
      # against the 55-140s fun band. Review-only — never gates the build.
      - name: Opera balance playtest (advisory)
        continue-on-error: true
        run: |
          BAL_HOME="/tmp/reef-balance"
          rm -rf "$BAL_HOME"
          mkdir -p "$BAL_HOME/data" "$BAL_HOME/config"
          XDG_DATA_HOME="$BAL_HOME/data" XDG_CONFIG_HOME="$BAL_HOME/config" \
            timeout 10m godot --headless -s scripts/probe_opera_balance.gd -- --touch 2>&1 | grep -E "^BALANCE\|" || true

      # The art manifest is the machine-readable contract between the acts and
      # codex's concept art (see CODEX_NEXTGEN_OBJECTS_2026-07-25.md). It is a
      # generator, not a gate: it derives the per-beat object/state list from
      # OperaHouse.ACTS so a redesign cannot silently leave the art brief
      # stale. Published on every run — including red ones — so the brief stays
      # available while gameplay work is still in flight.
      - name: Publish opera art manifest (advisory)
        if: always()
        continue-on-error: true
        run: |
          timeout 5m godot --headless -s scripts/probe_art_manifest.gd 2>&1 \
            | grep -E "^ARTMANIFEST\|" || true

      - name: Upload opera art manifest
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opera-art-manifest
          path: audit/opera_art_manifest.json
          if-no-files-found: warn

      # The screenshot captures below are review aids, not gameplay gates.
      # They are continue-on-error so a flaky Xvfb capture cannot fail this
      # workflow and thereby block the Android APK publish (android.yml
      # triggers only on this workflow's overall success). A missing capture
      # still surfaces as a warning annotation on the run.
      - name: Capture first-world visual review
        continue-on-error: true
        env:
          REEF_SHOT_OUT: /tmp/reef-shots
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          mkdir -p "$REEF_SHOT_OUT"
          # The headless display driver never emits frame_post_draw, so image
          # capture must use a real X11 viewport. Xvfb + software rendering is
          # deterministic on the hosted runner and keeps the project on Mobile.
          timeout 6m xvfb-run -a godot --rendering-method mobile -s scripts/probe_reef_shots.gd
          # display-only capture (no assertions); runs here rather than the headless gate
          timeout 6m xvfb-run -a godot --rendering-method mobile -s scripts/probe_human_art_audit.gd || true

      - name: Upload first-world visual review
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reef-first-world-review
          path: /tmp/reef-shots/*.png
          if-no-files-found: warn

      - name: Capture Sky Lagoon visual review
        continue-on-error: true
        env:
          SKY_LAGOON_SHOT_OUT: /tmp/sky-lagoon-shots
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          mkdir -p "$SKY_LAGOON_SHOT_OUT"
          timeout 8m xvfb-run -a godot --rendering-method mobile -s scripts/probe_sky_lagoon_art.gd

      - name: Upload Sky Lagoon visual review
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sky-lagoon-review
          path: /tmp/sky-lagoon-shots/*.png
          if-no-files-found: warn

      - name: Capture northern-world visual review
        continue-on-error: true
        env:
          NORTH_SHOT_OUT: /tmp/northern-shots
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          mkdir -p "$NORTH_SHOT_OUT"
          timeout 6m xvfb-run -a godot --rendering-method mobile -s scripts/probe_northern_art_audit.gd

      - name: Upload northern-world visual review
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: northern-world-review
          path: /tmp/northern-shots/*.png
          if-no-files-found: warn

      # The boss arena, one frame per beat. The 2026-08-02 stress test found
      # three defects NO headless probe could see (the chase cam stealing the
      # lens, the tell cropped off the top of the phone, a shadow that flew
      # with the boss), so a boss ships with a capture pass from now on.
      - name: Capture dust-boss arena review
        continue-on-error: true
        env:
          DUSTBOSS_SHOT_OUT: /tmp/dust-boss-shots
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          mkdir -p "$DUSTBOSS_SHOT_OUT"
          timeout 8m xvfb-run -a godot --rendering-method mobile --resolution 1280x720 -s scripts/probe_dust_boss_shots.gd

      - name: Upload dust-boss arena review
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dust-boss-arena-review
          path: /tmp/dust-boss-shots/*.png
          if-no-files-found: warn

      - name: Capture pearl-castle visual review
        continue-on-error: true
        env:
          CASTLE_SHOT_OUT: /tmp/castle-pearl-shots
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          mkdir -p "$CASTLE_SHOT_OUT"
          timeout 6m xvfb-run -a godot --rendering-method mobile -s scripts/probe_castle_pearl_art.gd

      - name: Upload pearl-castle visual review
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pearl-castle-review
          path: /tmp/castle-pearl-shots/*.png
          if-no-files-found: warn
