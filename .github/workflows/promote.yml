name: Promote dev to master

# The only way master moves. Dispatch from the Actions tab or with:
# gh workflow run promote.yml --ref dev
# It follows the latest dev head while probes are running, fast-forwards only
# after that exact dev commit is green, and promotes its checksum-verified APK.
# Master history therefore stays identical to probed history while an owner
# request remains a single command.

on:
  workflow_dispatch:

permissions:
  contents: write
  # the green-probe check below reads workflow runs via the API; with an
  # explicit permissions block everything unlisted is 'none', so grant it
  actions: read

concurrency:
  group: promote-master
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # persist-credentials stays ON here: the fast-forward push below is the
      # one legitimate git write in the whole pipeline
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: dev
          fetch-depth: 0

      - name: Resolve latest green dev HEAD
        id: green_dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One owner command is enough even when probes are still queued or
          # another agent advances dev while this workflow is waiting.
          for generation in $(seq 1 20); do
            git fetch --quiet origin dev
            SHA=$(git rev-parse origin/dev)
            CURRENT="$SHA"
            echo "candidate dev HEAD: $SHA (generation $generation/20)"
            for attempt in $(seq 1 100); do
              git fetch --quiet origin dev
              CURRENT=$(git rev-parse origin/dev)
              if [ "$CURRENT" != "$SHA" ]; then
                echo "dev advanced from $SHA to $CURRENT; following the new head"
                break
              fi
              STATE=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/probes.yml/runs?head_sha=$SHA&per_page=20" \
                | python3 -c "import json,sys; runs=[r for r in json.load(sys.stdin)['workflow_runs'] if r.get('head_branch') == 'dev']; print('success' if any(r.get('conclusion') == 'success' for r in runs) else ('pending' if not runs or any(r.get('status') != 'completed' for r in runs) else (runs[0].get('conclusion') or 'unknown')))")
              echo "dev probe state for $SHA: $STATE (attempt $attempt/100)"
              case "$STATE" in
                success)
                  git fetch --quiet origin dev
                  CURRENT=$(git rev-parse origin/dev)
                  if [ "$CURRENT" != "$SHA" ]; then
                    echo "dev advanced after the green check; following $CURRENT"
                    break
                  fi
                  echo "sha=$SHA" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
                failure|timed_out|action_required|startup_failure|skipped)
                  echo "::error::Refusing to promote: dev probes for $SHA concluded '$STATE'."
                  exit 1
                  ;;
              esac
              sleep 20
            done
            if [ "$CURRENT" = "$SHA" ]; then
              echo "::error::Timed out waiting for dev probes on $SHA."
              exit 1
            fi
          done
          echo "::error::dev changed too many times while promotion was waiting."
          exit 1

      - name: Fast-forward master to dev
        run: |
          SHA="${{ steps.green_dev.outputs.sha }}"
          git fetch origin dev master
          if [ "$(git rev-parse origin/dev)" != "$SHA" ]; then
            echo "::error::dev advanced after its green check. Dispatch promotion once more."
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/master "$SHA"; then
            echo "master has commits that are not on dev. Merge origin/master into dev first, let probes go green, then re-run."
            exit 1
          fi
          git push origin "${SHA}:master"
          echo "master fast-forwarded to $SHA"

      - name: Promote the dev-channel APK to the stable channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The GITHUB_TOKEN push above cannot trigger probes.yml (GitHub
          # suppresses on:push workflows for GITHUB_TOKEN pushes), so
          # android.yml never rebuilds for master and the android-test
          # release went stale after every promotion (observed 2026-07-27:
          # stable APK was 10 days behind). The dev-channel APK was already
          # built from this exact commit after green probes, so promotion of
          # the stable channel is a checksum-verified copy, not a rebuild.
          SHA="${{ steps.green_dev.outputs.sha }}"
          # android.yml publishes the dev APK a few minutes after probes go
          # green; if promotion was dispatched immediately, wait for it.
          for i in $(seq 1 30); do
            if gh release view android-dev --json body -q .body | grep -q "$SHA"; then
              break
            fi
            echo "android-dev APK for $SHA not published yet (attempt $i/30); waiting 60s"
            sleep 60
          done
          if ! gh release view android-dev --json body -q .body | grep -q "$SHA"; then
            echo "::warning::android-dev has no APK built from $SHA; stable channel NOT updated. Re-run this workflow once the dev APK build for $SHA finishes."
            exit 1
          fi
          mkdir -p /tmp/apk
          gh release download android-dev --pattern 'roshan-reef.apk*' --dir /tmp/apk
          (cd /tmp/apk && sha256sum -c roshan-reef.apk.sha256)
          gh release upload android-test /tmp/apk/roshan-reef.apk /tmp/apk/roshan-reef.apk.sha256 --clobber
          cat > /tmp/apk/notes.md <<EOF
          Debug APK of Mermaid Roshan Reef of Light, built only after the probe suite passed.
          Commit: $SHA (promoted from the dev channel; checksum-verified copy of the CI build)
          On the phone: download roshan-reef.apk, open it, and allow "install unknown apps" when prompted.

          Bookmarkable direct link (always the newest build on this channel):
          https://github.com/${GITHUB_REPOSITORY}/releases/download/android-test/roshan-reef.apk

          From a computer with the phone plugged in: \`./pull-apk.sh\`
          EOF
          gh release edit android-test --notes-file /tmp/apk/notes.md
          echo "stable channel updated to the APK built from $SHA"
