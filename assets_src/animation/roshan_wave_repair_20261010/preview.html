<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roshan wave review</title>
<style>body{margin:0;background:#eef2f8;color:#203047;font:16px system-ui,sans-serif}main{max-width:1000px;margin:32px auto;padding:0 24px}h1{font-size:24px}select,button,input{font:inherit}select,button{padding:9px 12px;border:1px solid #bac6d6;border-radius:8px;background:white;color:inherit}button{cursor:pointer}.stage{margin:20px 0;border-radius:16px;display:grid;place-items:center;background:#2d3744;min-height:520px}canvas{width:512px;height:512px;max-width:100%;object-fit:contain}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}input[type=range]{flex:1;min-width:200px}p{line-height:1.5}.swatch{width:34px;height:34px;border-radius:50%;padding:0}.status{min-height:2em;font-size:14px}</style>
<main><h1>Roshan’s wave</h1><select id="draft" aria-label="Wave sample"></select><p class="status" id="status"></p><div class="stage" id="stage"><canvas id="canvas" width="256" height="256"></canvas></div><div class="controls"><button id="play">Pause</button><button id="prev" aria-label="Previous frame">←</button><button id="next" aria-label="Next frame">→</button><input id="frame" aria-label="Frame" type="range" min="0" max="40" value="0"><output id="counter">0 / 40</output></div><p class="controls"><span>Backdrop</span><button class="swatch" data-color="#000000" style="background:#000000" aria-label="Black background"></button><button class="swatch" data-color="#2d3744" style="background:#2d3744" aria-label="Dark background"></button><button class="swatch" data-color="#f5f5f5" style="background:#f5f5f5" aria-label="Light background"></button><button class="swatch" data-color="#3a827d" style="background:#3a827d" aria-label="Teal background"></button><select id="zoom" aria-label="Preview size"><option value="256">Actual size</option><option value="512" selected>2× view</option><option value="768">3× view</option></select></p></main>
<script type="module">
const el=id=>document.getElementById(id),ctx=el('canvas').getContext('2d');let images=[],index=0,playing=true,start=performance.now(),catalog=[];
function show(n){index=(n+images.length)%images.length;ctx.clearRect(0,0,256,256);if(images[index])ctx.drawImage(images[index],0,0,256,256);el('frame').value=index;el('counter').textContent=`${index} / ${images.length-1}`;}
async function load(i){playing=false;catalog[i]&& (el('status').textContent='Loading…');const item=catalog[i];images=await Promise.all(Array.from({length:item.count},(_,n)=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Missing frame '+n));im.src=`${item.frames}/${String(n).padStart(4,'0')}.png`;})));el('status').textContent=item.note;el('frame').max=item.count-1;index=0;start=performance.now();playing=true;el('play').textContent='Pause';show(0);}
function pause(){playing=false;el('play').textContent='Play';}
el('play').onclick=()=>{playing=!playing;el('play').textContent=playing?'Pause':'Play';start=performance.now()-index*1000/24;};el('prev').onclick=()=>{pause();show(index-1);};el('next').onclick=()=>{pause();show(index+1);};el('frame').oninput=()=>{pause();show(Number(el('frame').value));};el('draft').onchange=()=>load(Number(el('draft').value));el('zoom').onchange=()=>{el('canvas').style.width=el('zoom').value+'px';el('canvas').style.height=el('zoom').value+'px';};document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>el('stage').style.background=b.dataset.color);
function animate(now){if(playing&&images.length)show(Math.floor((now-start)*24/1000)%images.length);requestAnimationFrame(animate);}requestAnimationFrame(animate);
try{catalog=await fetch('preview_catalog.json').then(r=>r.json());el('draft').replaceChildren(...catalog.map((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=r.label;return o;}));await load(0);}catch(e){el('status').textContent=e.message;pause();}
</script></html>
